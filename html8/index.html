<!DOCTYPE html>
<html lang="vi">
  <head>
    <title>Đăng ký Mùa hè xanh 2026</title>
  </head>
  <body>
    <h1>Đăng ký tham gia Chiến dịch Mùa hè xanh 2026</h1>
    <p>
      Hãy điền thông tin bên dưới để đăng ký tham gia chiến dịch tình nguyện.
    </p>

    <form action="/dang-ky" method="post" name="dangky">
      <p>
        Họ và tên:<br />
        <input
          type="text"
          name="hoten"
          placeholder="Họ và tên"
          required
        />
      </p>
      <p>
        Email:<br />
        <input type="email" name="email" placeholder="Email" />
      </p>

      <!-- Bài 8: bổ sung checkbox, radio, select và các kiểu input khác tại đây -->

      <p>
        <input type="submit" value="Gửi đăng ký" />
      </p>
    </form>
  </body>
</html>
