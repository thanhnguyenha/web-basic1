<!DOCTYPE html>
<html lang="vi">
  <head>
    <title>Thực hành CSS — Selector nâng cao</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Chiến dịch Mùa hè xanh 2026</h1>

    <div id="gioi-thieu">
      <h2 class="tieu-de">Giới thiệu</h2>
      <p class="mo-ta">
        Đoạn văn con trực tiếp của #gioi-thieu.
      </p>
      <section>
        <p>Đoạn văn cháu (nằm trong section, không phải con trực tiếp của div).</p>
      </section>
    </div>

    <p id="slogan" class="highlight">Tuổi trẻ cống hiến - Hành động vì cộng đồng</p>

    <div id="hoat-dong">
      <h2 class="tieu-de">Các hoạt động</h2>
      <ul>
        <li><span class="tag">Xây dựng</span> công trình thanh niên</li>
        <li><span class="tag">Môi trường</span> trồng cây xanh</li>
      </ul>
    </div>
  </body>
</html>
